name: Vigia do PC

# O monitor dos sites corre num PC sempre ligado e grava a hora da última
# verificação na variável PC_HEARTBEAT deste repo. Este workflow confere essa
# hora: se passar muito tempo sem sinal, o monitor está parado (PC desligado,
# sem internet, tarefa parada) e os avisos dos sites deixaram de existir.
# O PC, por seu lado, confere que este workflow tem corrido.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      testar_telegram:
        description: 'Mandar uma mensagem de teste para o Telegram'
        type: boolean
        default: false

concurrency:
  group: vigia
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # apagar o cache de estado antigo

env:
  MAX_MIN: 20      # o PC verifica de 5 em 5 min; 20 min sem sinal = parado

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ler o estado anterior
        uses: actions/cache/restore@v4
        with:
          path: state
          key: vigia-state-${{ github.run_id }}
          restore-keys: vigia-state-

      - name: Conferir o sinal de vida do PC
        id: v
        env:
          HB: ${{ vars.PC_HEARTBEAT }}
        run: |
          mkdir -p state
          : > alertas.txt
          antes=$(cat state/pc 2>/dev/null || echo up)
          if [ -z "$HB" ]; then
            echo "Ainda sem sinal do PC (variável PC_HEARTBEAT por criar)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          agora=$(date +%s)
          idade=$(( (agora - HB) / 60 ))
          quando=$(TZ=Europe/Lisbon date -d "@$HB" '+%d/%m %H:%M')
          echo "Último sinal do PC: $quando (há $idade min)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$idade" -gt "$MAX_MIN" ]; then
            echo down > state/pc
            if [ "$antes" != down ]; then
              echo "🔴 O monitor do PC parou: último sinal às $quando (há $idade min). Os sites não estão a ser vigiados." >> alertas.txt
              echo "caiu=1" >> "$GITHUB_OUTPUT"
            fi
          else
            echo up > state/pc
            [ "$antes" = down ] && echo "🟢 O monitor do PC voltou (último sinal às $quando)." >> alertas.txt
          fi
          exit 0

      - name: Guardar o estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: vigia-state-${{ github.run_id }}

      - name: Avisar no Telegram
        if: always()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TESTE: ${{ inputs.testar_telegram }}
        run: |
          touch alertas.txt
          [ "$TESTE" = true ] && echo "✅ Teste do vigia no GitHub: o Telegram está ligado." >> alertas.txt
          [ -s alertas.txt ] || exit 0
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "::warning::Sem TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID; aviso só por email."
            exit 0
          fi
          curl -sS --max-time 20 "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=$(cat alertas.txt)" -o /dev/null -w 'telegram: %{http_code}\n'

      - name: Apagar estados antigos do cache
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key vigia-state- --sort created_at --order desc --limit 100 --json id -q '.[5:][].id' \
            | xargs -r -n1 gh cache delete -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true

      # A execução a vermelho faz o GitHub mandar um email. Só na transição.
      - name: Falhar se o PC parou agora
        if: steps.v.outputs.caiu == '1'
        run: |
          echo "::error::O monitor do PC deixou de dar sinal."
          exit 1
